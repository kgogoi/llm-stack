# ==============================================================================
# LiteLLM Proxy Configuration: Model Routing & Effort Tiers
# ==============================================================================
# POST-SETUP INSTRUCTIONS:
# 1. Ensure you have populated your provider API key(s) in Litellm/.env
#    (e.g., OPENROUTER_API_KEY=sk-or-v1-...)
# 2. Select and customize the models you want to use for each effort tier below.
# 3. You can add, remove, or modify models as needed.
# ==============================================================================

model_list:
  # ============================================================================
  # TIER 1: Economy / Fast (Floor) Pool
  # Recommended for: Routine queries, quick summaries, lightweight tasks
  # Target Cost: Ultra-low / free tier
  # ============================================================================
  - model_name: tier-1-economy
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: tier-1-economy
    litellm_params:
      model: openrouter/qwen/qwen3.8-flash
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: tier-1-economy
    litellm_params:
      model: openrouter/openai/gpt-5.6-luna
      api_key: "os.environ/OPENROUTER_API_KEY"

  # ============================================================================
  # TIER 2: Balanced Workhorse Pool
  # Recommended for: Technical Q&A, code generation, report drafting
  # Target Cost: Moderate
  # ============================================================================
  - model_name: tier-2-workhorse
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: tier-2-workhorse
    litellm_params:
      model: openrouter/google/gemini-3.8-flash
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: tier-2-workhorse
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: "os.environ/OPENROUTER_API_KEY"

  # ============================================================================
  # TIER 3: SOTA Frontier Reasoning & Agent Pool
  # Recommended for: Deep multi-step reasoning, architectural planning, research
  # Target Cost: High-end / frontier
  # ============================================================================
  - model_name: tier-3-sota
    litellm_params:
      model: openrouter/openai/gpt-5.6-sol
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: tier-3-sota
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: tier-3-sota
    litellm_params:
      model: openrouter/qwen/qwen3.8-max-0902
      api_key: "os.environ/OPENROUTER_API_KEY"

  # ============================================================================
  # Local Embeddings (IBM Granite 125M)
  # Pre-configured to route to the internal container 'granite_embedding'
  # DO NOT REMOVE - required for local RAG & knowledge base search
  # ============================================================================
  - model_name: granite-embedding-125m
    litellm_params:
      model: openai/granite-embedding-125m
      api_base: http://granite_embedding:80/v1
      api_key: "none"

router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  timeout: 45
